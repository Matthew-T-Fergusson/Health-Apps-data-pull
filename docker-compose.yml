services:
  postgres-test:
    image: postgres:15-alpine
    container_name: health-pull-test-postgres
    environment:
      POSTGRES_DB: health_ops_test
      POSTGRES_USER: health_test
      POSTGRES_PASSWORD: health_test_password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_test -d health_ops_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
